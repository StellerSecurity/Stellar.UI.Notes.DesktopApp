<section class="sn-dialog-content unlock-note-dialog" aria-labelledby="unlock-note-title">
  <div class="sn-dialog-heading">
    <h2 id="unlock-note-title">{{'thisNoteIsLocked' | translate}}</h2>
    <button type="button" class="icon-button" (click)="dismiss(false)" [attr.aria-label]="'uiClose' | translate"><ion-icon name="close-outline" aria-hidden="true"></ion-icon></button>
  </div>
  <p class="description">{{'enterThePasswordForTheNote' | translate}}</p>
  <div class="sn-password">
    <ion-input #passwordInput [type]="showPassword ? 'text' : 'password'" [placeholder]="'enterYourPassword' | translate" [attr.aria-label]="'password' | translate" autocomplete="current-password" (keyup.enter)="onEnter()"></ion-input>
    <button type="button" class="icon-button" [attr.aria-label]="(showPassword ? 'uiHidePassword' : 'uiShowPassword') | translate" (click)="togglePasswordVisibility()"><ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true"></ion-icon></button>
  </div>
  <p class="sn-error" role="alert">{{error}}</p>
  <div class="sn-dialog-actions">
    <button type="button" class="sn-button" (click)="dismiss(false)">{{'cancel' | translate}}</button>
    <button type="button" class="sn-button primary" [disabled]="checking" (click)="dismiss(true)">{{'unlock' | translate}}</button>
  </div>
</section>
