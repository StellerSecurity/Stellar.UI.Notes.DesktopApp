<div class="user-popover">
  <div class="user-info">
    <ng-container *ngIf="isUserIsLoggedIn">
      <div class="label">{{'uiAccountName' | translate}}</div>
      <div class="name">{{user?.email}}</div>
    </ng-container>
    <ng-container *ngIf="!isUserIsLoggedIn">
      <div class="login-label">{{'uiLogInWithStellarID' | translate}}</div>
      <div class="login-sub-label">{{'uiSyncYourNotesAcrossYourDevices' | translate}}</div>

      <ion-button class="login-btn" (click)="goToLogin()">{{'login' | translate}}</ion-button>


      <div class="ion-margin-top">
        <a routerLink="/profile/create-account"  (click)="popoverController.dismiss()"
        style="font-weight: bold; font-size: 12px; text-decoration: none;">{{'createStellarID' | translate}}</a>
      </div>

    </ng-container>
  </div>

  <div class="menu-item-container">
    <button class="menu-item" (click)="openSettingsModal()">
      <!-- <ion-icon name="settings-outline"></ion-icon> -->
      <img src="assets/setting-horizontal.svg" />
      <span>{{'settings' | translate}}</span>
    </button>

    <button *ngIf="isUserIsLoggedIn" class="menu-item" (click)="confirmLogout()" style="border-top: 1px solid #EAEAF0;">
      <!-- <ion-icon name="log-out-outline"></ion-icon> -->
      <img src="assets/tabler-icon-logout.svg" />
      <span>{{'logout' | translate}}</span>
    </button>
  </div>
</div>
