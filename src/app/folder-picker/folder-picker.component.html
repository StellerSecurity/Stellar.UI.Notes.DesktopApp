<ion-modal class="sn-compact-modal folder-picker-modal" [isOpen]="open" (didDismiss)="openChange.emit(false)" (didPresent)="focus($event)">
  <ng-template>
    <form class="sn-dialog-content folder-picker" (ngSubmit)="confirm()">
      <div class="sn-dialog-heading"><h2>{{(creating ? 'uiNewFolder' : 'uiMoveToFolder') | translate}}</h2><button type="button" class="icon-button" (click)="openChange.emit(false)" [attr.aria-label]="'uiClose' | translate"><ion-icon name="close-outline"></ion-icon></button></div>
      <ng-container *ngIf="!creating">
        <label class="folder-search"><ion-icon name="search-outline"></ion-icon><input name="folderSearch" [(ngModel)]="query" [placeholder]="'uiSearch' | translate" [attr.aria-label]="'uiSearch' | translate" autocomplete="off"></label>
        <div class="folder-picker-list" role="radiogroup" [attr.aria-label]="'uiMoveToFolder' | translate">
          <label class="folder-picker-row" [class.chosen]="target === '__all__'"><input type="radio" name="folderTarget" value="__all__" [(ngModel)]="target"><ion-icon name="documents-outline"></ion-icon><span>{{'uiNoFolder' | translate}}</span><ion-icon class="folder-check" name="checkmark-outline"></ion-icon></label>
          <label class="folder-picker-row" *ngFor="let folder of filteredFolders" [class.chosen]="target === folder.name"><input type="radio" name="folderTarget" [value]="folder.name" [(ngModel)]="target"><ion-icon name="folder-outline"></ion-icon><span>{{folder.name}}</span><ion-icon class="folder-check" name="checkmark-outline"></ion-icon></label>
        </div>
      </ng-container>
      <div class="folder-create-field" *ngIf="creating"><label for="new-move-folder">{{'uiFolderName' | translate}}</label><input id="new-move-folder" class="sn-input" name="newFolderName" [(ngModel)]="name" maxlength="80" autocomplete="off" [placeholder]="'uiFolderName' | translate"></div>
      <div class="folder-picker-footer"><button *ngIf="!creating" type="button" class="text-link" (click)="createFolder()"><ion-icon name="add-outline"></ion-icon>{{'uiNewFolder' | translate}}</button><div class="sn-dialog-actions"><button type="button" class="sn-button" (click)="creating ? creating = false : openChange.emit(false)">{{'cancel' | translate}}</button><button type="submit" class="sn-button primary" [disabled]="creating && !name.trim()">{{(creating ? 'uiCreate' : 'uiMove') | translate}}</button></div></div>
    </form>
  </ng-template>
</ion-modal>
