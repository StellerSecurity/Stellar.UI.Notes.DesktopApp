<div class="sn-dialog-content secret-dialog">
  <div class="sn-dialog-heading"><h2>{{'shareNote' | translate}}</h2><button class="icon-button" type="button" (click)="closeModal()" [attr.aria-label]="'uiClose' | translate"><ion-icon name="close-outline"></ion-icon></button></div>
  <ng-container *ngIf="step === 1">
    <div class="secret-card">
      <div class="secret-brand"><img src="./assets/stellar-secret-icon.png" alt=""><strong>{{'stellarSecret' | translate}}</strong><a href="https://stellarsecret.io/how-it-works" target="_blank" rel="noopener noreferrer"><ion-icon name="information-circle-outline"></ion-icon>{{'howItWorks' | translate}}</a></div>
      <h3>{{'shareYourNoteAsAsSecretMessage' | translate}}</h3>
      <p>{{'shareYourNoteAsAsSecretMessageDescForDesktop' | translate}}</p>
    </div>
    <p class="sn-error" *ngIf="errorMessage" role="alert">{{errorMessage}}</p>
    <div class="sn-dialog-actions"><button type="button" class="sn-button" (click)="closeModal()">{{'cancel' | translate}}</button><button type="button" class="sn-button primary" (click)="createSecret()" [disabled]="isLoading" [attr.aria-busy]="isLoading"><ion-spinner *ngIf="isLoading" name="crescent" aria-hidden="true"></ion-spinner>{{'createSecret' | translate}}</button></div>
  </ng-container>
  <ng-container *ngIf="step === 2">
    <div class="secret-success" role="status"><ion-icon name="checkmark-circle-outline"></ion-icon><h3>{{'yourNoteSecretCreated' | translate}}</h3><p>{{'copyLinkOrShareIt' | translate}}</p></div>
    <div class="secret-copy-row"><input class="sn-input" readonly [value]="secretUrl" [attr.aria-label]="'hereIsYourSecretLink' | translate"><button type="button" class="sn-button primary" (click)="copyLink()"><ion-icon name="copy-outline"></ion-icon>{{'copy' | translate}}</button></div>
    <div class="secret-burn"><button type="button" class="sn-button danger" [disabled]="isDeletingSecret" (click)="burnSecret()"><ion-icon name="trash-outline"></ion-icon>{{(isDeletingSecret ? 'burningSecret' : 'burnSecret') | translate}}</button></div>
  </ng-container>
</div>
