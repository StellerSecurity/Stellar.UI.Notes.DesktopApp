<div class="editor-container">
  <quill-editor
    [(ngModel)]="note_text"
    format="html"
    theme="snow"
    [modules]="quillModules"
    (ngModelChange)="onContentChange($event)"
    (onEditorCreated)="onEditorCreated($event)"
    (onFocus)="onEditorFocusIn()"
    (onBlur)="onEditorFocusOut()"
    placeholder="Enter your note here..">
  </quill-editor>
</div>
