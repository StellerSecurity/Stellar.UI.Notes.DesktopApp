<div class="sn-menu" role="menu" (keydown)="onMenuKey($event)">
<button role="menuitem" *ngIf="!multiple" (click)="dismiss('pin')"><ion-icon name="pin-outline"></ion-icon>{{note.pinned ? ('uiUnpin' | translate) : ('uiPin' | translate)}}</button>
<button role="menuitem" (click)="dismiss('favorite')"><ion-icon name="star-outline"></ion-icon>{{allFavorite ? ('uiRemoveFromFavorites' | translate) : ('uiFavorite' | translate)}}</button>
<button role="menuitem" (click)="dismiss('move')"><ion-icon name="folder-open-outline"></ion-icon>{{'uiMoveToFolder' | translate}}</button>
<button role="menuitem" *ngIf="!multiple" (click)="dismiss('lock')"><ion-icon name="lock-closed-outline"></ion-icon>{{locked ? ('uiUnlockNote' | translate) : note.protected ? ('removeLock' | translate) : ('lockNote' | translate)}}</button>
<button role="menuitem" *ngIf="!multiple" [disabled]="locked" (click)="dismiss('share')"><ion-icon name="share-social-outline"></ion-icon>{{'share' | translate}}</button>
<button role="menuitem" class="danger" (click)="dismiss('delete')"><ion-icon name="trash-outline"></ion-icon>{{'delete' | translate}}</button>
</div>
